# Design-of-Man/regenortho -> .github/workflows/rebuild.yml
#
# Rebuilds the static site when its SOURCE changes, and commits what the build regenerates.
# The portal (JARVIS content queue) adds one entry to BLOG_POSTS in blog_content.py and
# nothing else; build.py turns that into the post page, the blog index, the RSS feed and
# sitemap.xml.
#
# See client-site-actions/README.md in Design-of-Man/ClientPortal for how this fits together
# and what the portal does with the result.
name: Rebuild site

on:
  push:
    branches: [main]
    # SOURCE ONLY. The commit this workflow pushes back is built output (blog/**, index.html,
    # sitemap.xml, ...), which does not match these paths — that is what stops it
    # retriggering itself. Removing this filter creates an infinite rebuild loop on a live
    # site.
    paths:
      - 'blog_content.py'
      - 'forms_content.py'
      - 'build.py'

permissions:
  contents: write

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOT boilerplate. build.py derives page dates from git history; a shallow clone's
          # boundary commit has no parent to diff against, so every file reads as touched by
          # it and every page gets the same wrong date. See the README.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 build.py

      - name: Commit rebuilt pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            # A source change that regenerates nothing is not an error — it just means the
            # build's output for this commit is identical. Say so and succeed: the portal
            # reads this run's conclusion as "the post is live".
            echo "Build produced no changes."
            exit 0
          fi
          git commit -m "Rebuild site

          Regenerated by the rebuild Action from ${GITHUB_SHA}."
          git push
